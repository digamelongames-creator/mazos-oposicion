name: Avisos de preguntas pendientes
on:
  schedule:
    - cron: "7 4-21 * * *"   # cada hora; el script decide si toca aviso (hora de Madrid)
  workflow_dispatch:
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: avisos
      - run: node enviar.js
        working-directory: avisos
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          APP_URL: https://digamelongames-creator.github.io/mazos-oposicion/
