name: Avisos de preguntas pendientes
on:
  # Desactivado hasta configurar los avisos. Para activarlo, añade el secreto VAPID_PRIVATE y descomenta:
  # schedule:
  #   - cron: "7 4-21 * * *"
  workflow_dispatch:
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: avisos
      - run: node enviar.js
        working-directory: avisos
        env:
          FIREBASE_URL: https://curva-olvido-f89d1-default-rtdb.europe-west1.firebasedatabase.app
          VAPID_PUBLIC: BHAtZqRCT_ODxcQvuAUfTjQn8Q83Kf6FSUrMAo2liOSDssT6qNbG3baZY_o3PRWN5iODwL7YpfpnVAl3Z9RQQqo
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          APP_URL: https://digamelongames-creator.github.io/mazos-oposicion/
